<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi MLDS Nouvelle-Aquitaine</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js" defer></script>
<script src="lib/xlsx.full.min.js" defer></script>
<script src="demo.js?v=2" defer></script>
<script src="rapports.js?v=3" defer></script>
<script src="app.js?v=5" defer></script>
<style>
  :root {
    --bg: #f6f6f6; --card: #ffffff; --text: #1e1e1e; --muted: #666; --line: #e5e5e5;
    --blue: #000091; --blue-bg: #e3e3fd; --green: #18753c; --green-bg: #e3f4e8; --amber: #b34000; --amber-bg: #fff1e0;
    --red: #ce0500; --red-bg: #fde8e7; --grey: #c9c9c9; --grey-bg: #f0f0f0;
    --suivi: #3558a2; --peda: #7d4e9e; --inge: #00807a; --form: #c76b00; --autre: #929292;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Marianne, "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  button { font: inherit; }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 24px 0; display: flex; flex-direction: column; gap: 12px; }
  .top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
  h1 { font-size: 18px; margin: 0; }
  h1 small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  select, input, textarea { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--text); }
  .btn { background: var(--blue); color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; font-weight: 600; white-space: nowrap; }
  .btn.sec { background: var(--card); color: var(--blue); border: 1px solid var(--blue); }
  .btn:disabled { opacity: .5; cursor: default; }
  .tabs { display: flex; gap: 4px; }
  .tab { border: 0; background: none; padding: 10px 14px; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; font-weight: 600; }
  .tab.on { color: var(--blue); border-bottom-color: var(--blue); }
  .demo { margin: 14px 24px 0; padding: 8px 12px; border-radius: 8px; background: #e8edff; color: var(--blue); font-size: 12px; }
  .err { margin: 14px 24px 0; padding: 10px 14px; border-radius: 8px; background: var(--red-bg); color: var(--red); font-size: 13px; }
  main { padding: 16px 24px 40px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 0; }
  .card h2 { font-size: 15px; margin: 0 0 12px; }
  .card h2 small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 14px; }
  .grid2b { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
  @media (max-width: 1000px) { .grid2, .grid2b { grid-template-columns: 1fr; } }

  /* fil d'Ariane */
  .crumb { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
  .crumb button { border: 0; background: none; color: var(--blue); cursor: pointer; padding: 2px 0; text-decoration: underline; }
  .crumb b { font-size: 16px; }
  .crumb .sep { color: var(--muted); }

  /* indicateurs */
  .kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .kpi b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 12px; color: var(--muted); }
  .kpi em { display: block; font-style: normal; font-size: 12px; margin-top: 4px; }
  .kpi.ok b { color: var(--green); } .kpi.warn b { color: var(--amber); } .kpi.ko b { color: var(--red); }
  .kpi.ko { border-color: #f6b7b5; background: #fffafa; }

  /* tableaux */
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .tbl td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tbl td.n, .tbl th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: #f5f5fe; }
  .tbl td.name { min-width: 170px; }
  .tbl td.name b { color: var(--blue); }
  .scroll { overflow-x: auto; }
  .meter { display: flex; white-space: nowrap; align-items: center; gap: 8px; justify-content: flex-end; }
  .meter i { display: block; height: 6px; border-radius: 3px; background: var(--grey-bg); width: 70px; position: relative; overflow: hidden; }
  .meter i u { position: absolute; inset: 0 auto 0 0; background: var(--green); }
  .meter.ko i u { background: var(--red); } .meter.warn i u { background: #f5a000; }
  .tag { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; white-space: nowrap; margin: 1px 2px; }
  .tag.ok { background: var(--green-bg); color: var(--green); }
  .tag.warn { background: var(--amber-bg); color: var(--amber); }
  .tag.ko { background: var(--red-bg); color: var(--red); }
  .tag.wait { background: var(--grey-bg); color: var(--muted); }
  .tag.info { background: var(--blue-bg); color: var(--blue); }
  .warnc { color: var(--amber); font-weight: 600; } .koc { color: var(--red); font-weight: 600; }

  /* points d'attention */
  .alerts { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .alerts li { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--grey-bg); cursor: pointer; }
  .alerts li:hover { background: #e9e9f9; }
  .alerts li b { font-size: 20px; text-align: center; font-variant-numeric: tabular-nums; }
  .alerts li.ko b { color: var(--red); } .alerts li.warn b { color: var(--amber); }
  .alerts li span small { display: block; color: var(--muted); font-size: 12px; }
  .vide { color: var(--muted); font-size: 13px; }

  /* graphiques */
  svg text { font-family: inherit; font-size: 11px; fill: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .hbar { display: grid; grid-template-columns: 170px 1fr 44px; gap: 8px; align-items: center; font-size: 12px; margin: 5px 0; }
  .hbar div { height: 12px; border-radius: 3px; background: var(--grey-bg); overflow: hidden; display: flex; }
  .hbar div i { display: block; height: 100%; }
  .hbar b { text-align: right; font-variant-numeric: tabular-nums; }

  /* jeunes */
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .bar input[type=search] { flex: 1; min-width: 220px; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 13px; cursor: pointer; color: var(--text); }
  .chip.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  .etab { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .etab-head { display: grid; grid-template-columns: 18px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; cursor: pointer; }
  .etab-head:hover { background: #fafafa; }
  .etab-head span { color: var(--muted); font-size: 12px; }
  .chev { color: var(--muted); transition: transform .15s; }
  .open > .etab-head .chev, .jeune.open .chev { transform: rotate(90deg); }
  .jeunes { display: none; border-top: 1px solid var(--line); }
  .etab.open .jeunes { display: block; }
  .jeune { border-bottom: 1px solid var(--line); }
  .jeune:last-child { border-bottom: 0; }
  .jeune-head { display: grid; grid-template-columns: 18px 230px 1fr 150px 210px; gap: 12px; align-items: center; padding: 10px 16px 10px 34px; cursor: pointer; }
  @media (max-width: 1000px) { .jeune-head { grid-template-columns: 18px 1fr; } .jeune-head > :nth-child(n+3) { grid-column: 2; } }
  .jeune-head:hover { background: #fafafa; }
  .jeune-head .nom b { display: block; } .jeune-head .nom span { color: var(--muted); font-size: 12px; }
  .jeune-head .last { font-size: 12px; color: var(--muted); } .jeune-head .last b { color: var(--text); font-size: 13px; }
  .fiche { display: none; padding: 4px 16px 16px 64px; }
  .jeune.open .fiche { display: grid; grid-template-columns: 260px 1fr; gap: 24px; }
  @media (max-width: 1000px) { .jeune.open .fiche { grid-template-columns: 1fr; padding-left: 34px; } }
  dl.f { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 13px; align-content: start; }
  dl.f dt { color: var(--muted); } dl.f dd { margin: 0; }
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl li { display: grid; grid-template-columns: 74px 12px 1fr; gap: 10px; padding-bottom: 10px; position: relative; font-size: 13px; }
  .tl li:not(:last-child)::after { content: ""; position: absolute; left: 89px; top: 15px; bottom: -1px; width: 2px; background: var(--line); }
  .tl .d { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .tl .p { width: 12px; height: 12px; border-radius: 50%; margin-top: 3px; position: relative; z-index: 1; }
  .tl small { display: block; color: var(--muted); }
  .fiche .btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  /* agenda */
  .cal-nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .cal-nav b { font-size: 15px; margin: 0 6px; }
  .cal { display: grid; grid-template-columns: 48px repeat(5, minmax(130px, 1fr)); min-width: 760px; }
  .cal-h { font-size: 12px; font-weight: 600; padding: 6px; border-bottom: 1px solid var(--line); }
  .cal-h small { display: block; color: var(--muted); font-weight: 400; }
  .cal-h.today { color: var(--blue); }
  .hours, .day { position: relative; height: 560px; }
  .hours div { position: absolute; right: 6px; font-size: 11px; color: var(--muted); transform: translateY(-50%); }
  .day { border-left: 1px solid var(--line); background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px 56px); cursor: copy; }
  .ev { position: absolute; left: 3px; right: 3px; border-radius: 5px; padding: 3px 6px; font-size: 11.5px; line-height: 1.25; overflow: hidden; border-left: 3px solid; cursor: pointer; background: var(--grey-bg); }
  .ev b { display: block; }
  .cal-tot { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .cal-tot b { color: var(--text); }

  /* fenêtre de saisie */
  .modal-bg { position: fixed; inset: 0; background: rgba(20, 20, 40, .35); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 20; }
  .modal { background: var(--card); border-radius: 12px; width: min(720px, 100%); padding: 20px 22px; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
  .modal h3 { margin: 0 0 14px; font-size: 17px; }
  .fm { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
  .fm label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .fm label.full { grid-column: 1 / -1; }
  .fm .checks { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--text); font-size: 13px; }
  .fm .checks label { flex-direction: row; align-items: center; gap: 5px; color: var(--text); font-size: 13px; }
  .modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .msg { font-size: 13px; color: var(--red); margin-top: 8px; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 13px; z-index: 30; }
  .tag.prof { background: #efe7fb; color: #6a3fa0; }
  .tbl.rap td, .tbl.rap th { white-space: nowrap; }
  .tbl.rap th { white-space: normal; min-width: 70px; vertical-align: bottom; }
  .tbl.rap tr.tot td { font-weight: 700; background: var(--grey-bg); }
  .tbl.rap th.grp { text-align: center; border-bottom: 2px solid var(--blue); color: var(--blue); }
  .zero { color: var(--grey); }
  .btn-lien { background: none; border: 0; padding: 0; color: var(--blue); cursor: pointer; font: inherit; font-size: 12px; text-decoration: underline; }
  .crumb .retour { padding: 5px 12px; font-size: 13px; text-decoration: none; margin-right: 6px; }
  .crumb button:not(.retour) { font-size: 14px; }
  dl.f.entete { grid-template-columns: max-content 1fr; margin-bottom: 4px; }
  dl.f.entete dd { border-bottom: 1px dotted var(--grey); min-width: 240px; }
  .tbl.mat td.t { background: #fafafa; font-weight: 600; }
  .tbl.mat th { font-size: 11px; }
  .okc { color: var(--green); font-weight: 600; }
  ol.notes { list-style: none; padding: 0; margin: 12px 0 0; font-size: 12px; color: var(--muted); columns: 2; }
  @media (max-width: 900px) { ol.notes { columns: 1; } }
  .tbl.rap .fixe { position: sticky; left: 0; background: var(--card); z-index: 1; box-shadow: 1px 0 0 var(--line); min-width: 170px; white-space: normal; }
  .tbl.rap tr.tot .fixe, .tbl.rap tr.stot .fixe { background: var(--grey-bg); }
  .tbl.mat th.grp { min-width: 74px; max-width: 120px; font-size: 11px; line-height: 1.25; cursor: help; }
  .tbl.mat.detail th.grp { max-width: none; }
  .tbl.mat td.pec, .tbl.mat th.pec { background: #f3f3fd; }
  .tbl.prev th { font-size: 11px; cursor: help; }
  .tbl.prev tr.zap td { background: var(--blue-bg); color: var(--blue); font-weight: 700; font-size: 12px; position: sticky; left: 0; }
  .tbl.prev tr.stot td { background: var(--grey-bg); font-weight: 600; font-size: 12px; }
  .tbl.prev tr.pafi td { border-top: 2px solid var(--line); font-style: italic; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Suivi MLDS<small id="sous-titre">Région académique Nouvelle-Aquitaine</small></h1>
    <div class="actions">
      <select id="periode" aria-label="Période"></select>
      <button class="btn sec" id="export">⤓ Excel</button>
      <button class="btn sec" id="nouveau-jeune">+ Jeune</button>
      <button class="btn" id="nouvelle-action">+ Action</button>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab on" data-v="pilotage">Pilotage</button>
    <button class="tab" data-v="jeunes">Jeunes suivis</button>
    <button class="tab" data-v="agenda">Agenda</button>
    <button class="tab" data-v="rapports">Rapports</button>
  </nav>
</header>
<div id="bandeau"></div>
<main id="vue"></main>
</body>
</html>
